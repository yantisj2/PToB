# Application-specific ARB timescale carries the Pi's UTC-numbered system clock.
# Transport test only: no transmit hardware timestamp or traceability claim.
[ptpengine]
preset = masteronly
interface = wlan0
domain = 24
ip_mode = multicast
delay_mechanism = E2E
log_sync_interval = -3
log_announce_interval = 0
ptp_timescale = ARB
time_traceable = N
frequency_traceable = N

[clock]
no_adjust = Y

[global]
foreground = Y
verbose_foreground = Y
