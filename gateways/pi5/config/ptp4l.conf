# Isolated IEEE 1588v2 Ethernet bench: L2/E2E, domain 24, hardware timestamps.
[global]
domainNumber 24
network_transport L2
delay_mechanism E2E
time_stamping hardware
twoStepFlag 1
serverOnly 1
clockClass 248
clockAccuracy 0xfe
timeSource 0xa0
# Kernel CLOCK_TAI supplies the operating offset at launch. UTC and frequency
# traceability remain unqualified; no GNSS or calibrated accuracy is claimed.
utc_offset 0
offsetScaledLogVariance 0xffff
priority1 248
priority2 248
logSyncInterval -3
logAnnounceInterval 0
summary_interval 0
uds_address /run/ptob-ptp4l
uds_ro_address /run/ptob-ptp4lro

[eth0]
