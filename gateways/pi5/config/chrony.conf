# NTP supplies UTC seconds; PPS supplies phase only when real pulses arrive.
pool 2.debian.pool.ntp.org iburst maxsources 4 minpoll 4 maxpoll 6
refclock PPS /dev/pps-ptob refid PTOB poll 0 dpoll 0 prefer
driftfile /var/lib/chrony/chrony.drift
makestep 0.1 3
rtcsync
maxdistance 0.1
leapsectz right/UTC
logdir /var/log/chrony
log tracking measurements statistics refclocks
# Serve the operator-requested Wi-Fi test and later Ethernet bench.
allow
