# Explicit RC7 lab image option. Stock Zephyr requests HFXO for synthesized LF.
# Preserve the conservative 500ppm declaration and all controller reservations.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=n
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_DEBUG=n
# Sole bounded UI temperature owner; Zephyr TEMP and LFRC owners remain absent.
CONFIG_NRFX_TEMP=y
