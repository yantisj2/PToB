# Stage 1: stock initialization only. No advertising, scan, connection or flash commands.
CONFIG_BT=y
CONFIG_BT_LL_SW_SPLIT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=n
CONFIG_BT_SETTINGS=n
CONFIG_BT_MAX_CONN=4
CONFIG_BT_DEVICE_NAME="T096 R2 BLE 0.4"
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_PHY_CODED=n
CONFIG_BT_CTLR_DF=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="T096 V12 R2 BLE 0.4"
CONFIG_USB_DEVICE_MANUFACTURER="PToB experiment"
CONFIG_USB_DEVICE_SN="TC-00-0000000000000000"
CONFIG_USB_CDC_ACM=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_0_INTERRUPT_DRIVEN=n
CONFIG_UART_0_ASYNC=y
CONFIG_UART_NRFX_UARTE_ENHANCED_RX=y
CONFIG_UART_0_ENHANCED_POLL_OUT=n
CONFIG_UART_0_NRF_HW_ASYNC=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_SHELL=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=8192
# Reclaim3KiB from an observed >7KiB-unused workqueue stack for RX headroom.
# Retain5KiB here; runtime stack high-water diagnostics remain enabled.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=5120
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_BT_HCI_TX_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_ASSERT=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_HWINFO=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_REBOOT=y
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_NRF_GPREGRET=y
CONFIG_RETAINED_MEM_MUTEX_FORCE_DISABLE=y
# Preserve the planned credential area plus existing diagnostic banks. No writes in stage 1.
CONFIG_ROM_END_OFFSET=0x6000
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI=y
CONFIG_SPI_ASYNC=y
CONFIG_SPI_COMPLETION_TIMEOUT_TOLERANCE=10
CONFIG_POLL=y
CONFIG_PWM=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_HEX=y

# Native connected coarse-service profile; no periodic precision train.
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_MAX_PAIRED=0
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_L2CAP_TX_MTU=226
CONFIG_BT_BUF_ACL_RX_SIZE=230
CONFIG_BT_BUF_ACL_TX_SIZE=230
CONFIG_BT_BUF_ACL_TX_COUNT=12
CONFIG_BT_CONN_TX_MAX=12
CONFIG_BT_ATT_TX_COUNT=12
CONFIG_BT_CREATE_CONN_TIMEOUT=2
CONFIG_BT_CTLR_DATA_LENGTH_MAX=230
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_BUF_EVT_RX_COUNT=20
# Legacy initiation with channel-selection2 requires FOUR free LLL RX nodes.
# The default one extra RX buffer leaves only five total, shared with scan,
# AUX and periodic reporting. Real matching GM advertisements were repeatedly
# rejected with ENOBUFS before CONNECT_IND. Reserve headroom without changing
# controller decisions, assertions, packet size, MTU or timing reservations.
CONFIG_BT_CTLR_RX_BUFFERS=8
CONFIG_BT_CTLR_LOW_LAT=n
# Use the stock controller's abort/skip path for a late event preparation.
# All other assertions remain enabled; authority and disconnect deadlines do not change.
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y

# Stock Bluetooth requires a cooperative system workqueue.
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-1

CONFIG_POWEROFF=y
CONFIG_SOC_FLASH_NRF_RADIO_SYNC_TICKER=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE_MS=2

# Dedicated application PPS capture. Controller TIMER0/1 remain unchanged.
CONFIG_NRFX_TIMER3=y
CONFIG_NRFX_PPI=y

# Queryable main/system BLE workqueue high-water measurements.
CONFIG_INIT_STACKS=y

# Complete 158-byte 1M periodic precision train alongside connected control.
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
CONFIG_BT_PER_ADV=y
CONFIG_BT_CTLR_ADV_SYNC_SET=2
CONFIG_BT_PER_ADV_SYNC=y
CONFIG_BT_PER_ADV_SYNC_MAX=1
CONFIG_BT_PER_ADV_SYNC_BUF_SIZE=191
CONFIG_BT_CTLR_ADV_DATA_CHAIN=n
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=191
CONFIG_BT_CTLR_SCAN_DATA_LEN_MAX=191
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_CTLR_SCAN_AUX_SYNC_RESERVE_MIN=n

# Expose existing LFRC temperature-cycle counters; no additional TEMP owner.
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_DEBUG=y

# Stock controller expiry metadata avoids deferred auxiliary-offset search.
CONFIG_BT_TICKER_EXT_EXPIRE_INFO=y
CONFIG_BT_TICKER_PRIORITY_SET=y

CONFIG_TINYCRYPT=y
CONFIG_TINYCRYPT_SHA256=y
CONFIG_TINYCRYPT_SHA256_HMAC=y

# Retain compiler frame sizes for every application/controller translation unit.
CONFIG_STACK_USAGE=y

# Public Cortex-M DWT cycle timing for bounded application lock diagnostics.
CONFIG_TIMING_FUNCTIONS=y
CONFIG_CORTEX_M_DWT=y
